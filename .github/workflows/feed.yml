name: Refresh job feed
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 playwright
      - run: python -m playwright install --with-deps chromium
      - run: python fetch_feed.py
      - run: |
          git config user.name "job-feed bot"
          git config user.email "actions@users.noreply.github.com"
          git add feed.json
          git commit -m "Refresh feed $(date -u +%F)" || echo "no change"
          git push
